name: Test and Deploy

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m venv venv310
        source venv310/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest requests pymupdf

    - name: Run pytest
      run: |
        source venv310/bin/activate
        pytest tests --junitxml=results.xml || true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results.xml

    - name: Image validation
      run: |
        source venv310/bin/activate
        python - <<'EOF'
import fitz
from scripts.image_checker import check_images

pdf_path = 'tests/test_image_iscenter.pdf'
doc = fitz.open(pdf_path)
result = check_images(doc, pdf_path)

print('User Summary:', result['user_summary'])
print('Admin Details:', result['admin_details'])

if '✅' in result['user_summary']:
    exit(0)
else:
    exit(1)
EOF
        || true

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: 89.104.71.29
        username: root
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /opt/gradio-app
          ./deploy.sh
